global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'srv-node'
    static_configs:
      - targets: ['localhost:9100']
  - job_name: 'blackbox-app'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://REPLACE_WITH_APP_HOST/']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
rule_files:
  - /etc/prometheus/rules/blackbox.rules.yml
  - /etc/prometheus/rules/srv.rules.yml
