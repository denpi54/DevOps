apiVersion: v1
kind: Service
metadata:
  name: {{ include "django-pg.fullname" . | default .Chart.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    app: {{ include "django-pg.name" . | default .Chart.Name }}
